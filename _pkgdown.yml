title: compact

url: https://smorabit.github.io/compact/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: compact
  sidebar:
    structure: [license, citation, authors, dev]

authors:
  Sam Morabito:
    href: https://smorabit.github.io
  Zechuan Shi:
    href: https://rootze.github.io/
  Swarup Lab:
    href: https://swaruplab.bio.uci.edu/

deploy:
  install_metadata: true

navbar:
  structure:
    left: [articles, reference, news]
    right: [search, github]
  components:
    news:
      text: News
      href: news/index.html
    articles:
      text: Vignettes
      menu:
      - text: Quick Start
        href: articles/quickstart.html
      - text: Basics — Simulated Branching Trajectory
        href: articles/simulation_tutorial.html
      - text: Advanced Use Cases — NSCLC CD8+ T Cells
        href: articles/advanced_NSCLC.html
      # divider + heading: groups the assessment vignettes inside the same
      # dropdown. Bootstrap 5 has no nested submenus, so this is the grouping
      # mechanism pkgdown provides.
      - text: ---------
      - text: Perturbation Assessment
      - text: Distance-based State Similarity
        href: articles/distance_assessment.html
      - text: SHAP Key Driver Genes
        href: articles/shap_key_drivers.html
      - text: Pathways Alert System
        href: articles/alertsystem_tutorial.html
      # - text: Alert System
      #   href: articles/alert_system.html

articles:
- title: Getting Started
  desc: Introductory tutorials covering the core compact workflow.
  contents:
  - quickstart
  - simulation_tutorial
- title: Advanced Use Cases
  desc: Advanced workflows using custom gene sets, custom networks, and multi-perturbation analyses.
  contents:
  - advanced_NSCLC
- title: Perturbation Assessment
  desc: Analyses to run once a perturbed assay exists, for quantifying and interpreting its effect.
  contents:
  - distance_assessment
  - shap_key_drivers
  - alertsystem_tutorial
